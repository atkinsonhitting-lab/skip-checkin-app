# Render deploy config — free tier, Docker runtime.
# Push this folder as its own GitHub repo, then Render → New → Web Service → select the repo.
services:
  - type: web
    name: skip-checkin-app
    runtime: docker
    plan: free
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: SKIP_API_KEY
        generateValue: true
      # Coach login email (seeded on first boot).
      - key: COACH_EMAIL
        value: "atkinsonhitting@gmail.com"
      # Set to "true" for the FIRST deploy only so the coach account is seeded.
      # Copy the credentials from the deploy logs, then remove this var and redeploy.
      - key: SEED_ON_BOOT
        value: "true"
      # Talk to Skip (AI chat): paste a free Google AI Studio key here. Get one at
      # https://aistudio.google.com/ (sign in, "Get API key" — no card required).
      # Until set, the chat tab tells hitters it isn't switched on yet.
      # Free tier = rate-limited; hitters are capped at 30 messages/day each.
      - key: LLM_API_KEY
        value: ""
      # Optional: override the chat model (default gemini-2.5-flash).
      # - key: LLM_MODEL
      #   value: "gemini-2.5-flash"
    # NOTE: the free tier has an EPHEMERAL filesystem — the SQLite database
    # (accounts + check-ins) is wiped when the service restarts. Fine for
    # testing. For real use, upgrade to Starter ($7/mo) and add a persistent
    # disk mounted at /app/data:
    #   disk:
    #     name: skip-data
    #     mountPath: /app/data
    #     sizeGB: 1
    # (The Dockerfile already points DB_PATH at /app/data/skip.db.)
